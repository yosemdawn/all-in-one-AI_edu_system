# 唯一生产入口：docker compose --env-file backend/.env.production up -d --build
services:
  frontend:
    build: { context: ., dockerfile: Dockerfile }
    image: yosem-frontend:prod
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      backend: { condition: service_healthy }

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args: { NODE_IMAGE: "${NODE_IMAGE:-node:22-alpine}" }
    image: yosem-backend:prod
    restart: unless-stopped
    env_file: [./backend/.env.production]
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: uniquelocal
      MONGODB_URI: "mongodb://yosem:${MONGO_APP_PASSWORD:?Set a random hex MONGO_APP_PASSWORD}@mongo:27017/yosem_ai?authSource=yosem_ai"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?Set a random hex REDIS_PASSWORD}@redis:6379"
    volumes: [uploads_data:/app/uploads]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, scripts/healthcheck.js]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mongo:
    image: "${MONGO_IMAGE:-mongo:7}"
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}"
      MONGO_APP_PASSWORD: "${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD}"
    volumes:
      - mongo_data:/data/db
      - ./deploy/mongo-init.js:/docker-entrypoint-initdb.d/01-app.js:ro
    healthcheck:
      test: [CMD-SHELL, 'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)"']
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: "${REDIS_IMAGE:-redis:7-alpine}"
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  redis_data:
  uploads_data:
